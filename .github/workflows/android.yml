name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            android/native/target
          key: android-rust-${{ runner.os }}-${{ hashFiles('android/native/Cargo.lock', 'android/build-native.sh') }}
      - name: Rust license tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=cargo-about-0.9.3-x86_64-unknown-linux-musl.tar.gz
          gh release download 0.9.3 --repo EmbarkStudios/cargo-about --pattern "$archive" --pattern "$archive.sha256" --dir "$RUNNER_TEMP/cargo-about"
          cd "$RUNNER_TEMP/cargo-about"
          sha256sum -c "$archive.sha256"
          tar -xzf "$archive"
          tool=$(find "$PWD" -type f -name cargo-about -print -quit)
          test -n "$tool"
          chmod +x "$tool"
          dirname "$tool" >> "$GITHUB_PATH"
      - name: Native libraries and licenses
        run: |
          cargo fetch --manifest-path android/native/Cargo.toml --locked
          bash android/build-native.sh
      - name: Tests, APKs and lint
        working-directory: android
        run: bash gradlew testDebugUnitTest assembleRelease assembleDebugAndroidTest lintDebug lintRelease --console=plain
      - name: Build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CopyOver-android-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/reports/lint-results-*.html
          if-no-files-found: error
