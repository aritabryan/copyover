name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      COPYOVER_LANGUAGE: es  # the tests compare Spanish texts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Tests
        env:
          COPYOVER_TEST_CLIPBOARD: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: install.sh syntax
        if: runner.os == 'Linux'
        run: bash -n install.sh && bash -n instalar.sh
