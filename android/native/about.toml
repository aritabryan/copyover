# cargo-about configuration for the third-party notices bundled in the APK.
# Generated by build.ps1 / build-native.sh into app/src/main/assets/licenses-rust.txt.

# Licenses allowed in libpuente_core.so; anything else makes `cargo about generate --fail` stop the build.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
]

# Only the crates that end up inside the Android library.
targets = ["aarch64-linux-android", "x86_64-linux-android"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Our own crate (publish = false) is not a third-party component.
private = { ignore = true }

# ring 0.17 ships its licenses in two files, and the built-in "ring" workaround of
# cargo-about only covers the older single-LICENSE layout. Without this, every
# license header found in ring's C sources is listed separately. The checksums
# make the build fail if a ring update changes these files, so they get reviewed.
[ring.clarify]
license = "Apache-2.0 AND ISC"

[[ring.clarify.files]]
path = "LICENSE-other-bits"
license = "ISC"
checksum = "f025ccfb7dfb6bdfedc75ca0f67acc69e6fb4998143d834f7c2f38a29989680f"

[[ring.clarify.files]]
path = "LICENSE-BoringSSL"
license = "Apache-2.0"
checksum = "005fc765ddc5115da796cca915baa9557abae13ff35e0a47c47affc56f6c414d"
